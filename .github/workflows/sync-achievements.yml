name: Sync GitHub Achievements in Realtime

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run achievements sync script
        run: python scripts/sync_achievements.py

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/achievements
          if git diff --staged --quiet; then
            echo "No new achievements detected. Everything up to date."
          else
            git commit -m "Auto-update profile achievement badges [skip ci]"
            git push
          fi
